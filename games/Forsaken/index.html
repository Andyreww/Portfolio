<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Forsaken</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>
        /* Define portfolio color variables for use in this file */
        :root {
            --portfolio-bg-main: #f4f4f0;
            --portfolio-accent-color: #CD853F;
            --portfolio-accent-color-rgb: 205, 133, 63;
            --portfolio-text-dark: #000000;
            --portfolio-text-medium: #333333;
            --portfolio-shadow-base: 0 6px 24px rgba(0, 0, 0, 0.07);
            --portfolio-card-border-radius: 24px;
            --portfolio-border-subtle: rgba(0, 0, 0, 0.08);
        }

        body {
             padding: 0;
             margin: 0;
             font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
             background: var(--portfolio-bg-main);
             min-height: 100vh;
             display: flex;
             flex-direction: column;
             align-items: center;
             justify-content: center;
             position: relative;
             overflow-x: hidden;
        }

        /* Noise Overlay - Matching Portfolio */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Style for the game title container */
        #game-title-container {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 100%;
            pointer-events: none;
            opacity: 0;
            animation: fallDownFadeIn 1s ease-out forwards 0.5s;
        }

        @keyframes fallDownFadeIn {
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        /* Style for the game title text */
        #game-title {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 4rem;
            color: var(--portfolio-text-dark);
            margin: 0;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        /* Responsive adjustments for the title */
        @media (max-width: 991.98px) {
            #game-title {
                font-size: 3rem;
            }
            #game-title-container {
                top: 30px;
            }
        }
        @media (max-width: 767.98px) {
            #game-title {
                font-size: 2.5rem;
            }
            #game-title-container {
                top: 20px;
            }
        }

        /* Style for the main Unity container */
        #unity-container {
            position: relative;
            left: auto;
            top: auto;
            transform: none;
            border-radius: var(--portfolio-card-border-radius);
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.05),
                0 8px 24px rgba(0, 0, 0, 0.05),
                0 16px 56px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--portfolio-border-subtle);
            margin-bottom: 20px;
            background: #000;
            z-index: 5;
        }

        #unity-container.unity-desktop {
            /* Desktop centering handled by flex body */
        }

        #unity-container.unity-mobile {
            position: fixed;
            width: 100%;
            height: 100%;
            border-radius: 0;
            box-shadow: none;
            left: 0;
            top: 0;
            transform: none;
            margin-bottom: 0;
            border: none;
        }

        /* Style the canvas background - might be visible before game loads */
        #unity-canvas {
            /* Use a color from your palette, maybe a dark text or a subtle variation */
            background: var(--portfolio-text-dark); /* Example: Use dark text color */
        }

        .unity-mobile #unity-canvas {
            width: 100%;
            height: 100%;
        }

        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: none;
            padding: 32px;
            background-color: rgba(244, 244, 240, 0.98);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.08),
                0 8px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--portfolio-border-subtle);
            z-index: 15;
        }

        /* Unity logo - keep original if it matches theme, or replace */
        /* Assuming the dark logo matches the dark text color from the portfolio */
        #unity-logo {
            width: 154px;
            height: 130px;
            /* Ensure correct path relative to this CSS file */
            background: url('TemplateData/unity-logo-dark.png') no-repeat center;
            background-size: contain; /* Ensure logo fits */
        }

        #unity-progress-bar-empty {
            width: 200px;
            height: 6px;
            margin-top: 16px;
            margin-left: 0;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            margin-top: 0;
            margin-left: 0;
            background: linear-gradient(90deg, var(--portfolio-accent-color), #d4a574);
            border-radius: 3px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: 0 0 8px rgba(205, 133, 63, 0.3);
        }

        #unity-footer {
            position: relative;
            background-color: rgba(244, 244, 240, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0 16px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--portfolio-border-subtle);
        }

        .unity-mobile #unity-footer {
            display: none; /* Hide footer on mobile */
        }

        #unity-logo-title-footer {
            /* Keep original if it matches theme, or replace */
            /* Assuming the title logo matches the dark text color */
            width: 102px;
            height: 38px;
            /* Ensure correct path relative to this CSS file */
            background: url('TemplateData/unity-logo-title-footer.png') no-repeat left center; /* Align left */
            background-size: contain;
            /* float: none; */ /* Ensure no float */
        }

        #unity-build-title {
            color: var(--portfolio-text-dark);
            line-height: 48px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            margin-right: 0;
            flex-grow: 1;
            text-align: center;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        #unity-fullscreen-button {
            cursor: pointer;
            width: 40px;
            height: 40px;
            background: url('TemplateData/fullscreen-button.png') no-repeat center;
            background-size: 50%;
            margin-left: 12px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        #unity-fullscreen-button:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translate(-50%, 0);
            background: rgba(244, 244, 240, 0.98);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--portfolio-text-dark);
            padding: 16px 24px;
            display: none;
            border-radius: 12px;
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.08),
                0 8px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--portfolio-border-subtle);
            max-width: 90%;
            text-align: center;
            z-index: 10;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        /* Style for specific warning/error types (controlled by unityShowBanner) */
        #unity-warning div {
            padding: 5px; /* Add padding inside the message div */
            margin: 5px 0; /* Add margin between multiple messages */
            border-radius: 5px; /* Rounded corners for message div */
        }

        #unity-warning div[style*='background: red'] {
            background: rgba(255, 0, 0, 0.1) !important; /* Use rgba for subtle red */
            color: #a00; /* Darker red text */
            border: 1px solid #a00;
        }

        #unity-warning div[style*='background: yellow'] {
            background: rgba(255, 255, 0, 0.1) !important; /* Use rgba for subtle yellow */
            color: #a90; /* Darker yellow/orange text */
            border: 1px solid #a90;
        }


        /* Style for the back to portfolio button */
        .back-to-portfolio-button-outside {
            position: fixed;
            bottom: 32px;
            left: 32px;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 2px solid var(--portfolio-accent-color);
            color: var(--portfolio-accent-color);
            background-color: rgba(244, 244, 240, 0.98);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 24px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.08),
                0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .back-to-portfolio-button-outside:hover {
            background-color: var(--portfolio-accent-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 24px rgba(var(--portfolio-accent-color-rgb), 0.25),
                0 12px 32px rgba(var(--portfolio-accent-color-rgb), 0.15);
        }

        .back-to-portfolio-button-outside:active {
            transform: translateY(0);
            box-shadow: 
                0 4px 12px rgba(var(--portfolio-accent-color-rgb), 0.2);
        }

        .back-to-portfolio-button-outside i {
            margin-right: 8px;
            font-size: 18px;
            transition: transform 0.3s ease-out;
        }

        .back-to-portfolio-button-outside:hover i {
            transform: translateX(-2px);
        }

        @media (max-width: 767.98px) {
            .back-to-portfolio-button-outside {
                bottom: 20px;
                left: 20px;
                padding: 10px 20px;
                font-size: 13px;
            }
        }

         /* Hide the button on mobile fullscreen to avoid obstructing the game */
         .unity-mobile .back-to-portfolio-button-outside {
             display: none;
         }


    </style>
  </head>
  <body>
    <div id="game-title-container">
        <h1 id="game-title">FORSAKEN</h1>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Forsaken</div>
      </div>
    </div>

    <a href="/" class="back-to-portfolio-button-outside" target="_top">
        <i class="bi bi-arrow-left-circle"></i> Back to Portfolio
    </a>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Forsaken_Demo_FINAL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Forsaken_Demo_FINAL.data.unityweb",
        frameworkUrl: buildUrl + "/Forsaken_Demo_FINAL.framework.js.unityweb",
        codeUrl: buildUrl + "/Forsaken_Demo_FINAL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Forsaken",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
