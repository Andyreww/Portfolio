<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Forsaken</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>
        /* Define portfolio color variables for use in this file */
        :root {
            --portfolio-bg-main: #fff6ec;
            --portfolio-accent-color: #CD853F;
            --portfolio-accent-color-rgb: 205, 133, 63; /* Added RGB for shadow */
            --portfolio-text-dark: #1a1a1a;
            --portfolio-text-medium: #333333;
            --portfolio-shadow-base: 0 6px 24px rgba(0, 0, 0, 0.07); /* Base shadow */
            /* Add other variables if needed for consistency */
        }

        body {
             padding: 0;
             margin: 0;
             /* Use the portfolio's main background color */
             background: var(--portfolio-bg-main);
             /* Ensure body is min-height 100vh to allow centering if game is small */
             min-height: 100vh;
             display: flex; /* Use flexbox for body to help center content */
             flex-direction: column; /* Stack children vertically */
             align-items: center; /* Center children horizontally */
             justify-content: center; /* Center children vertically */
             position: relative; /* Needed for absolute/fixed positioning of children */
        }

        /* Style for the game title container */
        #game-title-container {
            position: absolute; /* Position relative to body */
            top: 20px; /* Adjust vertical position */
            left: 50%;
            transform: translateX(-50%);
            z-index: 10; /* Ensure it's above the Unity container */
            text-align: center;
            width: 100%; /* Take full width for centering */
            pointer-events: none; /* Allow clicks to pass through to the game */
             /* Initial state for animation */
            opacity: 0;
            transform: translate(-50%, -50px); /* Start above its final position */
            animation: fallDownFadeIn 1s ease-out forwards 0.5s; /* Animation */
        }

        /* Keyframes for the fall down and fade in animation */
        @keyframes fallDownFadeIn {
            to {
                opacity: 1;
                transform: translate(-50%, 0); /* End at its final position */
            }
        }

        /* Style for the game title text */
        #game-title {
            font-family: 'Poppins', sans-serif; /* Use your portfolio heading font */
            font-weight: 700; /* Use a bold weight */
            font-size: 3em; /* Adjust size as needed */
            color: var(--portfolio-text-dark); /* Use your dark text color */
            margin: 0; /* Remove default margin */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1); /* Subtle text shadow */
            /* opacity is controlled by the container animation */
        }

        /* Responsive adjustments for the title */
        @media (max-width: 991.98px) { /* Adjust for smaller screens */
            #game-title {
                font-size: 2.5em; /* Smaller size on tablet */
            }
             #game-title-container {
                 top: 15px; /* Adjust position on tablet */
                 transform: translate(-50%, -40px); /* Adjust start position for animation */
                 animation: fallDownFadeIn 1s ease-out forwards 0.5s; /* Reapply animation */
             }
        }
         @media (max-width: 767.98px) { /* Adjust for even smaller screens */
            #game-title {
                font-size: 2em; /* Even smaller size on mobile */
            }
             #game-title-container {
                 top: 10px; /* Adjust position on mobile */
                 transform: translate(-50%, -30px); /* Adjust start position for animation */
                 animation: fallDownFadeIn 1s ease-out forwards 0.5s; /* Reapply animation */
             }
        }

        /* Style for the main Unity container */
        #unity-container {
            position: relative; /* Changed from absolute to relative for simpler centering within flex body */
            /* Remove left/top/transform centering as body handles it */
            left: auto;
            top: auto;
            transform: none;

            /* Add some padding around the container if needed, or let the canvas fill it */
            /* padding: 20px; */
            /* Use the portfolio's border radius and shadow for the container */
            border-radius: var(--portfolio-card-border-radius);
            box-shadow: var(--portfolio-shadow-base);
            overflow: hidden; /* Ensure canvas doesn't spill out of rounded corners */
            /* Add a subtle border */
            border: 1px solid rgba(0, 0, 0, 0.08); /* Using rgba directly or var(--portfolio-border-subtle) */
            /* Add margin below the container if needed */
            margin-bottom: 20px;
        }

        #unity-container.unity-desktop {
            /* No specific desktop centering needed here anymore */
        }

        #unity-container.unity-mobile {
            position: fixed;
            width: 100%;
            height: 100%;
            /* Remove border radius and shadow for mobile fullscreen */
            border-radius: 0;
            box-shadow: none;
            /* Remove transform for fixed positioning */
            left: 0;
            top: 0;
            transform: none;
             /* Remove margin on mobile */
            margin-bottom: 0;
        }

        /* Style the canvas background - might be visible before game loads */
        #unity-canvas {
            /* Use a color from your palette, maybe a dark text or a subtle variation */
            background: var(--portfolio-text-dark); /* Example: Use dark text color */
        }

        .unity-mobile #unity-canvas {
            width: 100%;
            height: 100%;
        }

        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: none; /* Controlled by Unity JS */
            /* Add some padding or margin if needed */
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.9); /* Semi-transparent white background */
            border-radius: 10px; /* Rounded corners for the loading bar container */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow */
        }

        /* Unity logo - keep original if it matches theme, or replace */
        /* Assuming the dark logo matches the dark text color from the portfolio */
        #unity-logo {
            width: 154px;
            height: 130px;
            /* Ensure correct path relative to this CSS file */
            background: url('TemplateData/unity-logo-dark.png') no-repeat center;
            background-size: contain; /* Ensure logo fits */
        }

        #unity-progress-bar-empty {
            width: 141px;
            height: 18px;
            margin-top: 10px;
            margin-left: 6.5px;
            /* Use a subtle background or border for the empty bar */
            background: rgba(0, 0, 0, 0.1); /* Light gray background */
            border-radius: 9px; /* Half of height for pill shape */
            overflow: hidden; /* Ensure fill stays inside */
            position: relative; /* Needed for absolute positioning of fill */
            /* Remove background image if using solid color */
            /* background: none; */
        }

        #unity-progress-bar-full {
            width: 0%; /* Initial width, controlled by Unity JS */
            height: 100%; /* Fill the height of the empty bar */
            margin-top: 0; /* Reset margin */
            margin-left: 0; /* Reset margin */
            /* Use the accent color for the progress bar fill */
            background: var(--portfolio-accent-color);
            border-radius: 9px; /* Match empty bar for pill shape */
            transition: width 0.3s ease-out; /* Smooth animation for progress fill */
            /* Remove background image if using solid color */
            /* background: none; */
            position: absolute; /* Position relative to #unity-progress-bar-empty */
            top: 0;
            left: 0;
        }

        #unity-footer {
            position: relative;
            /* Style the footer area */
            background-color: rgba(255, 255, 255, 0.9); /* Semi-transparent white */
            padding: 0 10px; /* Add some padding */
            height: 38px; /* Match height of elements inside */
            display: flex; /* Use flexbox for layout */
            align-items: center; /* Vertically center items */
            justify-content: space-between; /* Space out logo/title and button */
            /* Add subtle border top */
            border-top: 1px solid rgba(0, 0, 0, 0.08); /* Using rgba directly or var(--portfolio-border-subtle) */
            /* Remove float from children if they had it */
        }

        .unity-mobile #unity-footer {
            display: none; /* Hide footer on mobile */
        }

        #unity-logo-title-footer {
            /* Keep original if it matches theme, or replace */
            /* Assuming the title logo matches the dark text color */
            width: 102px;
            height: 38px;
            /* Ensure correct path relative to this CSS file */
            background: url('TemplateData/unity-logo-title-footer.png') no-repeat left center; /* Align left */
            background-size: contain;
            /* float: none; */ /* Ensure no float */
        }

        #unity-build-title {
            /* Use a text color from your palette */
            color: var(--portfolio-text-medium); /* Example: Use medium text color */
            /* Keep font styles or adjust */
            line-height: 38px;
            font-family: 'Poppins', sans-serif; /* Use your portfolio heading font */
            font-size: 16px; /* Adjust size */
            font-weight: 600; /* Use your heading font weight */
            /* float: none; */ /* Ensure no float */
            margin-right: 0; /* Remove margin */
            flex-grow: 1; /* Allow title to take available space */
            text-align: center; /* Center the title */
        }

        #unity-fullscreen-button {
            cursor: pointer;
            width: 38px;
            height: 38px;
            /* Ensure correct path relative to this CSS file */
            background: url('TemplateData/fullscreen-button.png') no-repeat center;
            background-size: 60%; /* Adjust size of icon */
            /* float: none; */ /* Ensure no float */
            margin-left: 10px; /* Add space between title and button */
        }

        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translate(-50%, 0); /* Center horizontally, fixed top */
            /* Use portfolio colors for warning */
            background: #ffffff; /* Using white directly or var(--portfolio-bg-card) */
            color: var(--portfolio-text-dark); /* Dark text */
            padding: 10px;
            display: none; /* Controlled by Unity JS */
            border-radius: 8px; /* Rounded corners */
            box-shadow: var(--portfolio-shadow-base); /* Subtle shadow */
            border: 1px solid rgba(0, 0, 0, 0.08); /* Using rgba directly or var(--portfolio-border-subtle) */
            max-width: 90%; /* Prevent overflow on small screens */
            text-align: center;
            z-index: 10; /* Ensure it's above the canvas */
        }

        /* Style for specific warning/error types (controlled by unityShowBanner) */
        #unity-warning div {
            padding: 5px; /* Add padding inside the message div */
            margin: 5px 0; /* Add margin between multiple messages */
            border-radius: 5px; /* Rounded corners for message div */
        }

        #unity-warning div[style*='background: red'] {
            background: rgba(255, 0, 0, 0.1) !important; /* Use rgba for subtle red */
            color: #a00; /* Darker red text */
            border: 1px solid #a00;
        }

        #unity-warning div[style*='background: yellow'] {
            background: rgba(255, 255, 0, 0.1) !important; /* Use rgba for subtle yellow */
            color: #a90; /* Darker yellow/orange text */
            border: 1px solid #a90;
        }


        /* Style for the back to portfolio button when OUTSIDE the footer */
        .back-to-portfolio-button-outside {
            position: fixed; /* Position relative to the viewport */
            bottom: 20px; /* Adjust vertical position */
            left: 20px; /* Adjust horizontal position */
            z-index: 20; /* Ensure it's above everything */

            display: inline-flex; /* Use flex for icon and text alignment */
            align-items: center;
            justify-content: center;
            text-decoration: none; /* Remove underline */
            /* Use portfolio button styling */
            border: 2px solid var(--portfolio-accent-color);
            color: var(--portfolio-accent-color);
            background-color: rgba(255, 255, 255, 0.9); /* Subtle white background */
            padding: 0.6rem 1.5rem; /* Increased padding for better touch target */
            font-family: 'Poppins', sans-serif; /* Use portfolio font */
            font-weight: 600; /* Match portfolio button weight */
            font-size: 0.9rem; /* Adjust font size */
            border-radius: 50px; /* Rounded pill shape */
            transition: all 0.3s ease-out; /* Smooth transition */
            cursor: pointer;
             /* Ensure text is not selectable */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
        }

        .back-to-portfolio-button-outside:hover {
            background-color: var(--portfolio-accent-color); /* Fill with accent color on hover */
            color: white; /* Change text color to white on hover */
            transform: translateY(-3px); /* Subtle lift effect */
            /* Use accent color in the shadow */
            box-shadow: 0 6px 12px rgba(var(--portfolio-accent-color-rgb), 0.3);
        }

         /* Active state for click feedback */
        .back-to-portfolio-button-outside:active {
             transform: translateY(-1px); /* Slightly lower on click */
             box-shadow: 0 3px 6px rgba(var(--portfolio-accent-color-rgb), 0.2);
        }

        .back-to-portfolio-button-outside i {
            margin-right: 0.6rem; /* Increased space between icon and text */
            font-size: 1.2em; /* Slightly larger icon size */
             /* Smooth transition for the icon */
            transition: transform 0.3s ease-out;
        }

         .back-to-portfolio-button-outside:hover i {
             transform: translateX(-3px); /* Subtle icon movement on hover */
         }

         /* Hide the button on mobile fullscreen to avoid obstructing the game */
         .unity-mobile .back-to-portfolio-button-outside {
             display: none;
         }


    </style>
  </head>
  <body>
    <div id="game-title-container">
        <h1 id="game-title">FORSAKEN</h1>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Forsaken</div>
      </div>
    </div>

    <a href="../../index.html" class="back-to-portfolio-button-outside" target="_top">
        <i class="bi bi-arrow-left-circle"></i> Back to Portfolio
    </a>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Forsaken_Demo_FINAL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Forsaken_Demo_FINAL.data.unityweb",
        frameworkUrl: buildUrl + "/Forsaken_Demo_FINAL.framework.js.unityweb",
        codeUrl: buildUrl + "/Forsaken_Demo_FINAL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Forsaken",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
