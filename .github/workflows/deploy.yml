name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'games/**'
      - 'index.html'
      - '.nojekyll'
      - '404.html'
      - 'extras.html'
      - 'extras-style.css'
      - 'extra-script.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if ! grep -q '/assets/index-' dist/index.html; then
            echo "ERROR: Built index.html does not contain compiled assets!"
            exit 1
          fi
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "ERROR: Built index.html still contains source file references!"
            exit 1
          fi
          echo "Build verification passed"

      - name: Publish built site to repository root
        run: |
          cp dist/index.html index.html
          mkdir -p assets
          rsync -a --delete dist/assets/ assets/
          if [ -d dist/games ]; then
            mkdir -p games
            rsync -a --delete dist/games/ games/
          fi
          for file in 404.html extras.html extras-style.css extra-script.js; do
            if [ -f "dist/$file" ]; then
              cp "dist/$file" .
            fi
          done
          touch .nojekyll

      - name: Commit and push deployment artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ games/ .nojekyll 404.html extras.html extras-style.css extra-script.js
          git diff --staged --quiet && echo "No deployment changes to commit" && exit 0
          git commit -m "Deploy built site [skip ci]"
          git push
