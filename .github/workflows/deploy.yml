name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if ! grep -q '/assets/index-' dist/index.html; then
            echo "ERROR: Built index.html does not contain compiled assets!"
            exit 1
          fi
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "ERROR: Built index.html still contains source file references!"
            exit 1
          fi
          echo "Build verification passed"

      - name: Publish built site to docs/
        run: |
          rm -rf docs
          cp -r dist docs
          touch docs/.nojekyll
          if [ -f CNAME ]; then
            cp CNAME docs/CNAME
          fi

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && echo "No docs changes to commit" && exit 0
          git commit -m "Deploy built site to docs [skip ci]"
          git push
