<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrew | Extras - Cinematic Showcase</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
  
  <link rel="stylesheet" href="extras-style.css"> 
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

</head>
<body>

  <div class="page-wrapper">
    <a href="index.html" class="back-to-portfolio-link">
      <i class="bi bi-arrow-left-circle-fill"></i> Back to Portfolio
    </a>

    <header class="extras-main-header">
      <h1>Andrew's Cinematic Universe</h1>
      <p>A showcase of films that define my taste.</p>
    </header>

    <main class="extras-content-area">
      <section id="favorite-movies-showcase" class="movie-grid-section">
        <h2 class="section-title">Top Three Picks</h2>
        <div class="movie-grid">
          <div class="movie-card-item movie-infinity-war">
            <img src="assets/Infinity_War.jpg" alt="Avengers: Infinity War Poster" class="movie-poster-img">
          </div>
          <div class="movie-card-item movie-interstellar">
            <img src="assets/Interstellar.jpg" alt="Interstellar Poster" class="movie-poster-img">
          </div>
          <div class="movie-card-item movie-oppenheimer">
            <img src="assets/Oppenheimer.jpg" alt="Oppenheimer Poster" class="movie-poster-img">
          </div>
        </div>
      </section>
      
      <section id="upcoming-film" class="upcoming-section">
        <h2 class="section-title">Most Anticipated Film</h2>
        <div class="upcoming-content">
            <div class="banner-container">
                <img src="assets/f1.jpg" alt="Most Anticipated Film Banner" class="upcoming-banner">
            </div>
            <h3 class="trailer-title">F1 | Main Trailer</h3>
            <div class="trailer-container">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/8skLAmcQEX4" 
                  title="F1 Trailer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; 
                  encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
        </div>
      </section>

      <section id="favorite-games-placeholder" class="placeholder-section">
        <h2 class="section-title">Favorite Games</h2>
         <p class="placeholder-text">(Showcase In Progress)</p>
      </section> 

    </main>

    <footer class="extras-main-footer">
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Andrew Angulo. All Rights Reserved.</p>
    </footer>
  </div>

</body>
</html>
