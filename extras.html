<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrew | Extras - Cinematic Showcase</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
  
  <link rel="stylesheet" href="extras-style.css"> 
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

</head>
<body>

  <div class="page-wrapper">
    <a href="index.html" class="back-to-portfolio-link">
      <i class="bi bi-arrow-left-circle-fill"></i> Back to Portfolio
    </a>

    <header class="extras-main-header">
      <h1>Andrew's Cinematic Universe</h1>
      <p>A showcase of films that define my taste.</p>
    </header>

    <main class="extras-content-area">
      <section id="favorite-movies-showcase" class="movie-grid-section">
        <h2 class="section-title">Top Three Picks</h2>
        <div class="movie-grid">
          <div class="movie-card-item movie-infinity-war">
            <a href="https://www.youtube.com/watch?v=6ZfuNTqbHE8" target="_blank">
              <img src="assets/Infinity_War.jpg" alt="Avengers: Infinity War Poster" class="movie-poster-img" onerror="this.onerror=null;this.src='https://placehold.co/260x390/10161d/f0f4f8?text=Infinity+War';">
            </a>
          </div>
          <div class="movie-card-item movie-interstellar">
            <a href="https://www.youtube.com/watch?v=zSWdZVtXT7E" target="_blank">
              <img src="assets/Interstellar.jpg" alt="Interstellar Poster" class="movie-poster-img" onerror="this.onerror=null;this.src='https://placehold.co/260x390/10161d/f0f4f8?text=Interstellar';">
            </a>
          </div>
          <div class="movie-card-item movie-oppenheimer">
            <a href="https://www.youtube.com/watch?v=uYPbbksJxIg" target="_blank">
              <img src="assets/Oppenheimer.jpg" alt="Oppenheimer Poster" class="movie-poster-img" onerror="this.onerror=null;this.src='https://placehold.co/260x390/10161d/f0f4f8?text=Oppenheimer';">
            </a>
          </div>
        </div>
      </section>
      
      <section id="upcoming-film" class="upcoming-section">
        <h2 class="section-title">The One I’m Counting Down For</h2>
        <div class="upcoming-content">
            <div class="banner-container">
                <img src="assets/weapons.jpeg" alt="Most Anticipated Film Banner" class="upcoming-banner" onerror="this.onerror=null;this.src='https://placehold.co/960x315/10161d/f0f4f8?text=F1+Banner';">
            </div>
            <div class="trailer-container">
                <iframe width="560" height="315"
                  src="https://www.youtube.com/embed/QKHySfXqN0I?si=ib-SWjgkqTY5rQMs" 
                  title="F1 Trailer" frameborder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen></iframe>
                <div class="youtube-placeholder" style="display: none;"> 
                    <i class="bi bi-youtube"></i>
                    <p>Trailer currently unavailable.</p>
                </div>
            </div>
        </div>
      </section>

      </main>

    <footer class="extras-main-footer">
        <p>© <script>document.write(new Date().getFullYear())</script> Andrew Angulo. All Rights Reserved.</p>
    </footer>
  </div>

  <button id="backToTopBtn" title="Go to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script>
    // Get the button
    let mybutton = document.getElementById("backToTopBtn");

    // When the user scrolls down 100px from the top of the document, show the button
    window.onscroll = function() {scrollFunction()};

    function scrollFunction() {
      if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {
        mybutton.classList.add("show");
      } else {
        mybutton.classList.remove("show");
      }
    }

    // When the user clicks on the button, scroll to the top of the document
    mybutton.onclick = function() {
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // YouTube iframe fallback logic
    const trailerFrame = document.querySelector('.trailer-container iframe');
    const trailerPlaceholder = document.querySelector('.trailer-container .youtube-placeholder');
    
    function showPlaceholder() {
        if (trailerFrame) trailerFrame.style.display = 'none';
        if (trailerPlaceholder) trailerPlaceholder.style.display = 'flex';
    }

    if (trailerFrame) {
        trailerFrame.onerror = showPlaceholder;
        // Check if src is invalid/placeholder
        if (!trailerFrame.src || trailerFrame.src.includes("googleusercontent.com") || trailerFrame.src.length < 30) { 
             showPlaceholder();
        } else if (trailerPlaceholder) {
            trailerPlaceholder.style.display = 'none';
        }
    } else if (trailerPlaceholder) {
        showPlaceholder();
    }

  </script>

</body>
</html>
